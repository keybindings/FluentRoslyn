name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # 8.0 runs the example app; 10.0 builds and runs the unit tests.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore FluentRoslyn.sln

      - name: Build
        run: dotnet build FluentRoslyn.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/FluentRoslyn.UnitTests -c Release --no-build --verbosity normal

      # The example generator builds its output entirely through the fluent API, so
      # running it proves the generated source actually compiles and behaves — the
      # end-to-end check that unit tests on their own cannot give.
      - name: Run example generator end-to-end
        run: |
          output=$(dotnet run --project examples/FluentRoslyn.Example.App -c Release --no-build)
          echo "$output"
          expected="Generator says: Hi from 'Generated Code'"
          if [ "$output" != "$expected" ]; then
            echo "::error::Example app output did not match."
            echo "expected: $expected"
            echo "actual:   $output"
            exit 1
          fi

      # The three-level chain: the meta-generator lifts [Template] methods into builder
      # calls at the *generator's* build time, the generator emits from them into the
      # app, and the app runs. Nothing but running it proves the chain still works —
      # a broken link mostly shows up as generated code silently missing.
      - name: Run templates chain end-to-end
        run: |
          output=$(dotnet run --project examples/FluentRoslyn.Example.Templates.App -c Release --no-build)
          echo "$output"
          expected=$'Add: 5\nDescribe: Cart has 4 item(s)\nIsEmpty: True\nTag: [sale]'
          if [ "$output" != "$expected" ]; then
            echo "::error::Templates example output did not match."
            echo "expected: $expected"
            echo "actual:   $output"
            exit 1
          fi

      # The symbol-driven case: the generator reads the app's own types as ISymbols and
      # emits a fluent builder for each. Running it proves the raw-name overloads
      # actually produce source that compiles and behaves.
      - name: Run builders example end-to-end
        run: |
          output=$(dotnet run --project examples/FluentRoslyn.Example.Builders.App -c Release --no-build)
          echo "$output"
          expected="3 x for Ada to Bristol"
          if [ "$output" != "$expected" ]; then
            echo "::error::Builders example output did not match."
            echo "expected: $expected"
            echo "actual:   $output"
            exit 1
          fi

      # Implementing a discovered interface: the generator enumerates IGreeter's members
      # and emits a forwarding decorator. Exercises raw-typed properties and the raw
      # null guard, neither of which the other examples reach.
      - name: Run decorator example end-to-end
        run: |
          output=$(dotnet run --project examples/FluentRoslyn.Example.Decorator.App -c Release --no-build)
          echo "$output"
          expected=$'[log] Greet\nHello, Ada\n[log] Count\nCount: 1\n[log] Reset\n[log] Count\nCount: 0'
          if [ "$output" != "$expected" ]; then
            echo "::error::Decorator example output did not match."
            exit 1
          fi

      - name: Pack
        run: |
          dotnet pack src/FluentRoslyn/FluentRoslyn.csproj -c Release --no-build -o artifacts
          dotnet pack src/FluentRoslyn.Templates/FluentRoslyn.Templates.csproj -c Release --no-build -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
