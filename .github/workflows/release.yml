name: Release

# Publishes to nuget.org via Trusted Publishing: the job exchanges a GitHub OIDC
# token for a temporary nuget.org API key valid for one hour, so no long-lived
# secret exists anywhere. The matching policy on nuget.org is keyed to this
# repository and this workflow's FILE NAME — renaming this file breaks publishing
# until the policy is updated to match.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Pack & publish
    runs-on: ubuntu-latest

    permissions:
      contents: write   # required to create the GitHub Release
      id-token: write   # required for GitHub to issue the OIDC token

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # 8.0 runs the example app; 10.0 builds and runs the unit tests.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore FluentRoslyn.sln

      - name: Build
        run: dotnet build FluentRoslyn.sln -c Release --no-restore

      # A published version is immutable, so everything CI checks is re-checked
      # here rather than trusting that main was green when the tag was cut.
      - name: Test
        run: dotnet test tests/FluentRoslyn.UnitTests -c Release --no-build --verbosity normal

      - name: Run example generator end-to-end
        run: |
          output=$(dotnet run --project examples/FluentRoslyn.Example.App -c Release --no-build)
          echo "$output"
          expected="Generator says: Hi from 'Generated Code'"
          if [ "$output" != "$expected" ]; then
            echo "::error::Example app output did not match."
            exit 1
          fi

      # The meta-generator chain: a generator whose own source is lifted from compiled,
      # type-checked C# by another generator, three compilations deep.
      - name: Run templates chain end-to-end
        run: |
          output=$(dotnet run --project examples/FluentRoslyn.Example.Templates.App -c Release --no-build)
          echo "$output"
          expected=$'Add: 5\nDescribe: Cart has 4 item(s)\nIsEmpty: True\nTag: [sale]'
          if [ "$output" != "$expected" ]; then
            echo "::error::Templates chain output did not match."
            exit 1
          fi

      # The symbol-driven case: the generator reads the app's own types as ISymbols and
      # emits a fluent builder for each.
      - name: Run builders example end-to-end
        run: |
          output=$(dotnet run --project examples/FluentRoslyn.Example.Builders.App -c Release --no-build)
          echo "$output"
          expected="3 x for Ada to Bristol"
          if [ "$output" != "$expected" ]; then
            echo "::error::Builders example output did not match."
            exit 1
          fi

      - name: Pack
        run: |
          dotnet pack src/FluentRoslyn/FluentRoslyn.csproj -c Release --no-build -o artifacts
          dotnet pack src/FluentRoslyn.Templates/FluentRoslyn.Templates.csproj -c Release --no-build -o artifacts

      # Guards against tagging one version and shipping another, which cannot be undone
      # once pushed. Asserting the exact expected filenames does three jobs at once: it
      # proves every package carries the tag's version, that both were actually produced,
      # and — via the count — that nothing unexpected slipped into the directory. The two
      # ids are listed rather than derived, because "everything before the version" is
      # ambiguous when one id is a prefix of the other. Skipped for manual runs, which
      # have no tag to compare against.
      - name: Verify package versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for id in FluentRoslyn FluentRoslyn.Templates; do
            expected="artifacts/$id.$tag.nupkg"
            if [ ! -f "$expected" ]; then
              echo "::error::Expected $expected for tag '$tag'. Both csproj <Version> values must equal the tag."
              ls -1 artifacts/*.nupkg || true
              exit 1
            fi
            echo "ok: $expected"
          done
          count=$(ls -1 artifacts/*.nupkg | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::Expected exactly 2 packages, found $count."
            ls -1 artifacts/*.nupkg
            exit 1
          fi

      # Roslyn is referenced with PrivateAssets=all so it never flows to consumers. That
      # is the central promise of both packages, so it is asserted rather than assumed —
      # for each of them, since a leak in either is a leak.
      - name: Verify no dependencies leak to consumers
        run: |
          for file in artifacts/*.nupkg; do
            echo "--- $file ---"
            unzip -l "$file"
            if unzip -p "$file" '*.nuspec' | grep -q '<dependency '; then
              echo "::error::$file declares dependencies; they must not flow to consumers."
              unzip -p "$file" '*.nuspec' | grep '<dependency '
              exit 1
            fi
            echo "Dependency groups are empty, as expected."
          done

      # Exchanges the OIDC token for a short-lived API key. The username is the
      # nuget.org profile name, which is public on every package page, so it is
      # written here rather than kept as a secret.
      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: keybindings

      # Templates goes FIRST, deliberately. Its id has never been published, and a
      # trusted-publishing policy is scoped to "all packages owned by this account" —
      # which says nothing about an id that has no owner yet, making this the step most
      # likely to fail. Pushed second, a failure would land after FluentRoslyn was
      # already live and immutable: re-tagging would then 409 on FluentRoslyn and fail
      # again, so the only way out would be burning a version number. Pushed first, a
      # failure publishes nothing and the same tag can simply be re-cut.
      #
      # --skip-duplicate on both makes a re-run idempotent rather than a 409. nuget.org
      # will not overwrite a published version whatever this flag says; it only decides
      # whether an already-present version is an error or a no-op. The tag/version
      # check above is what actually guards against shipping the wrong thing.
      - name: Push FluentRoslyn.Templates to nuget.org
        run: |
          file=$(ls artifacts/FluentRoslyn.Templates.*.nupkg)
          echo "pushing $file"
          dotnet nuget push "$file" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # Selected by excluding Templates rather than by globbing FluentRoslyn.*, which
      # would match FluentRoslyn.Templates.*.nupkg too.
      #
      # Pushes the symbol package with it. The .nupkg path does not name the .snupkg and
      # does not need to: the NuGet client looks for an adjacent one and pushes it to the
      # symbol endpoint itself. An earlier version of this workflow added a separate
      # snupkg step and it failed with 409, because the symbols were already there.
      # Verified in the run log: two PUTs, /api/v2/package/ then /api/v2/symbolpackage/,
      # both Created. Templates ships no symbols, so it has no equivalent.
      - name: Push FluentRoslyn to nuget.org
        run: |
          file=$(ls artifacts/*.nupkg | grep -v 'FluentRoslyn\.Templates\.')
          echo "pushing $file"
          dotnet nuget push "$file" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # A published tag with no Release leaves the repo's Releases tab empty while the
      # package is live. Notes come from the tag annotation when there is one.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          $([ "${GITHUB_REF_NAME#*-}" != "$GITHUB_REF_NAME" ] && echo --prerelease)
          artifacts/*.nupkg artifacts/*.snupkg

      - name: Upload published package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*
          if-no-files-found: error
